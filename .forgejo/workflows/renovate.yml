name: Renovate

# Keeps the pinned infrastructure versions fresh: the Ansible Galaxy roles in
# requirements.yml (tag-pinned ones only) and the MinIO / Adminer container image
# versions in the custom roles. Config lives in ../../renovate.json.
#
# One-time setup: add a Forgejo Personal Access Token as the repo/org secret
# RENOVATE_TOKEN (scopes: read/write on repositories + issues, so Renovate can
# push branches, open PRs and maintain the Dependency Dashboard issue).
# Optional: GITHUB_COM_TOKEN (a github.com read-only PAT) to avoid rate limits
# when Renovate fetches release notes for the GitHub-hosted roles.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Renovate
        uses: renovatebot/github-action@v41
        env:
          RENOVATE_PLATFORM: gitea
          RENOVATE_ENDPOINT: ${{ github.server_url }}/api/v1
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate@slovo-propovedi.ru>"
          GITHUB_COM_TOKEN: ${{ secrets.GITHUB_COM_TOKEN }}
          LOG_LEVEL: info
