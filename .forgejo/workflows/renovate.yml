name: Renovate

# Keeps the pinned infrastructure versions fresh: the Ansible Galaxy roles in
# requirements.yml (tag-pinned ones only) and the MinIO / Adminer container image
# versions in the custom roles. Config lives in ../../renovate.json.
#
# Renovate is run straight from npm (`npx renovate`) rather than via
# renovatebot/github-action, because this runner only resolves `uses:` refs
# against data.forgejo.org (which mirrors actions/* only, not renovatebot/*).
#
# One-time setup: add a Forgejo Personal Access Token as the repo/org secret
# RENOVATE_TOKEN with scopes:
#   write:repository, write:issue, read:user, read:organization
# (push branches, open PRs, maintain the Dependency Dashboard; the forgejo
# platform also queries /orgs/{org} on startup — hence read:organization).
# Optional: RENOVATE_GITHUB_COM_TOKEN (a github.com read-only PAT) to avoid rate
# limits when Renovate fetches release notes for the GitHub-hosted roles. It is
# passed to Renovate as GITHUB_COM_TOKEN below — Forgejo forbids secret names
# starting with GITHUB_, hence the RENOVATE_ prefix on the secret itself.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Renovate
        run: npx --yes renovate
        env:
          RENOVATE_PLATFORM: forgejo
          RENOVATE_ENDPOINT: ${{ github.server_url }}/api/v1
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate@example.com>"
          GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
          LOG_LEVEL: info
