---

- name: Fail if required slovo-pgbouncer variables are undefined
  ansible.builtin.fail:
    msg: "You need to define a required variable for `{{ item }}`."
  when: "lookup('vars', item, default='') is none or (lookup('vars', item, default='') | string | length == 0)"
  with_items:
    - slovo_pgbouncer_postgres_host
    - slovo_pgbouncer_postgres_username
    - slovo_pgbouncer_postgres_dbname
    # Note: slovo_pgbouncer_postgres_password is excluded because it references a
    # vault-encrypted variable (secret_slovo_backend_postgres_password). Using lookup()
    # here would trigger decryption and fail when no vault password is available. The
    # vault-encrypted variable is validated implicitly when it's actually used.
