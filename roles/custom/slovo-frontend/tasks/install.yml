---

- name: Ensure slovo-frontend paths exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: '0750'
    owner: "{{ slovo_user_name }}"
    group: "{{ slovo_group_name }}"
  with_items:
    - path: "{{ slovo_frontend_base_path }}"
      when: true
    - path: "{{ slovo_frontend_container_src_path }}"
      when: "{{ slovo_frontend_container_image_self_build }}"
  when: item.when | bool

- name: Ensure slovo-frontend labels file installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/labels.j2"
    dest: "{{ slovo_frontend_base_path }}/labels"
    mode: '0640'
    owner: "{{ slovo_user_name }}"
    group: "{{ slovo_group_name }}"
  register: slovo_frontend_labels_file_changed

- name: Ensure slovo-frontend nginx config installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/nginx.conf.j2"
    dest: "{{ slovo_frontend_base_path }}/nginx.conf"
    mode: '0640'
    owner: "{{ slovo_user_name }}"
    group: "{{ slovo_group_name }}"
  register: slovo_frontend_nginx_config_changed

- when: slovo_frontend_container_image_self_build | bool
  block:
    # A checkout owned by a different user (a uid change, an earlier clone by another user, etc.) would make the git task below fail on ownership or permissions.
    - name: Ensure slovo-frontend repository ownership is correct on self-build
      ansible.builtin.file:
        path: "{{ slovo_frontend_container_src_path }}"
        state: directory
        owner: "{{ slovo_user_name }}"
        group: "{{ slovo_group_name }}"
        recurse: true

    - name: Check if slovo-frontend repository is a valid git checkout
      ansible.builtin.stat:
        path: "{{ slovo_frontend_container_src_path }}/.git"
      register: slovo_frontend_git_check

    - name: Remove broken slovo-frontend repository if not a valid git checkout
      ansible.builtin.file:
        path: "{{ slovo_frontend_container_src_path }}"
        state: absent
      when: not slovo_frontend_git_check.stat.exists

    - name: Ensure git trusts the slovo-frontend repository directory
      ansible.builtin.command:
        cmd: "git config --global --add safe.directory {{ slovo_frontend_container_src_path }}"
      changed_when: false

    - name: Ensure slovo-frontend repository is present on self-build
      ansible.builtin.git:
        repo: "{{ slovo_frontend_container_image_self_build_repo }}"
        version: "{{ slovo_frontend_container_image_self_build_repo_version }}"
        dest: "{{ slovo_frontend_container_src_path }}"
        force: "yes"
      register: slovo_frontend_git_pull_changed

    # The git clone above runs as the ansible user (root), so the cloned files
    # end up owned by root. Restore ownership to the slovo user afterwards.
    - name: Ensure slovo-frontend repository ownership is correct after git clone on self-build
      ansible.builtin.file:
        path: "{{ slovo_frontend_container_src_path }}"
        state: directory
        owner: "{{ slovo_user_name }}"
        group: "{{ slovo_group_name }}"
        recurse: true

    - name: Ensure slovo-frontend container image is built
      ansible.builtin.command:
        cmd: |-
          {{ devture_systemd_docker_base_host_command_docker }} buildx build
          --memory={{ slovo_frontend_container_image_build_memory }} --cpus={{ slovo_frontend_container_image_build_cpus }}
          --tag={{ slovo_frontend_container_image }}
          --file={{ slovo_frontend_container_src_path }}/frontend/web-app/Dockerfile
          {{ slovo_frontend_container_src_path }}/frontend/web-app
      when: slovo_frontend_git_pull_changed.changed
      register: slovo_frontend_docker_image_build_changed

- name: Ensure slovo-frontend container network is created
  when: slovo_frontend_container_network != 'host'
  community.general.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ slovo_frontend_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"

- name: Ensure slovo-frontend.service installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/slovo-frontend.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/slovo-frontend.service"
    mode: '0644'
  register: slovo_frontend_systemd_unit_changed

- name: Determine whether slovo-frontend needs a restart
  ansible.builtin.set_fact:
    slovo_frontend_restart_necessary: >-
      {{
        slovo_frontend_labels_file_changed.changed | default(false)
        or slovo_frontend_nginx_config_changed.changed | default(false)
        or slovo_frontend_git_pull_changed.changed | default(false)
        or slovo_frontend_docker_image_build_changed.changed | default(false)
        or slovo_frontend_systemd_unit_changed.changed | default(false)
      }}
