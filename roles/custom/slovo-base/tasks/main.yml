---

- tags:
    - always
  block:
    - ansible.builtin.include_tasks: "{{ role_path }}/tasks/detect_platform.yml"

# This needs to always run, because it populates `slovo_user_uid` and `slovo_user_gid`,
# which are required by many other roles.
- tags:
    - always
    - setup-system-user
    - common
  block:
    - ansible.builtin.include_tasks: "{{ role_path }}/tasks/setup_slovo_user_linux.yml"
      when: ansible_facts.os_family != 'Darwin'

- tags:
    - setup-all
    - install-all
    - common
  block:
    - name: Ensure Slovo base path exists
      ansible.builtin.file:
        path: "{{ slovo_base_data_path }}"
        state: directory
        mode: "{{ slovo_base_data_path_mode }}"
        owner: "{{ slovo_user_name }}"
        group: "{{ slovo_group_name }}"

- tags:
    - setup-all
    - install-all
    - common
  block:
    - name: Ensure the systemd journald drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Limit the systemd journald disk usage
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/99-size-limit.conf
        content: |
          [Journal]
          SystemMaxUse={{ slovo_journald_system_max_use }}
        owner: root
        group: root
        mode: '0644'
      notify: Restart systemd-journald

# Run the restart now: if a later task fails, pending handlers would never fire,
# and the next run would report ok without applying the limit to the running journald.
- name: Apply the journald limit now (flush handlers)
  ansible.builtin.meta: flush_handlers
