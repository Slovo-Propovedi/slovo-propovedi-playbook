---

# slovo-swagger is a standalone static Swagger UI + OpenAPI spec service for slovo-propovedi.
# Project source code URL: https://git.lightnode.ru/Slovo_Propovedi/slovo-propovedi-docs
# The container image is built locally from the repository (see `Dockerfile` at the repo ROOT).
# Unlike the frontend, the nginx.conf is baked into the image — no config volume is mounted.

slovo_swagger_enabled: true

# The identifier used for the container name and the systemd service name.
slovo_swagger_identifier: "slovo-swagger"

# The hostname at which slovo-swagger is served.
slovo_swagger_hostname: ''

# The path at which slovo-swagger is served.
# This value must either be `/` or not end with a slash (e.g. `/swagger`).
slovo_swagger_path_prefix: /

slovo_swagger_base_path: "{{ slovo_base_data_path }}/swagger"

# Self-build (the container image is built locally from the git repository).
slovo_swagger_container_image_self_build: true
slovo_swagger_container_image_self_build_repo: "https://git.lightnode.ru/Slovo_Propovedi/slovo-propovedi-docs.git"
# The swagger repository uses `main` as its default branch (not `master` like the other repos).
slovo_swagger_container_image_self_build_repo_version: "main"
slovo_swagger_container_src_path: "{{ slovo_swagger_base_path }}/container-src"

# Build resource limits are enforced by the shared constrained buildx builder
# (see roles/custom/slovo-buildx). There are no per-build memory/cpu flags.

# The locally-built container image name.
slovo_swagger_container_image_name: "slovo-swagger"
slovo_swagger_container_image_tag: "latest"
slovo_swagger_container_image: "{{ slovo_swagger_container_image_name }}:{{ slovo_swagger_container_image_tag }}"

# The port nginx listens on inside the container (non-root, no special capabilities needed).
slovo_swagger_container_port: 8080

# The base container network. It will be auto-created by this role if it doesn't exist already.
slovo_swagger_container_network: ''

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
slovo_swagger_container_additional_networks: "{{ slovo_swagger_container_additional_networks_default + slovo_swagger_container_additional_networks_auto + slovo_swagger_container_additional_networks_custom }}"
slovo_swagger_container_additional_networks_default: []
slovo_swagger_container_additional_networks_auto: []
slovo_swagger_container_additional_networks_custom: []

# slovo_swagger_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
slovo_swagger_container_labels_traefik_enabled: true
slovo_swagger_container_labels_traefik_docker_network: "{{ slovo_swagger_container_network }}"
slovo_swagger_container_labels_traefik_hostname: "{{ slovo_swagger_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/swagger`).
slovo_swagger_container_labels_traefik_path_prefix: "{{ slovo_swagger_path_prefix }}"
slovo_swagger_container_labels_traefik_rule: "Host(`{{ slovo_swagger_container_labels_traefik_hostname }}`){% if slovo_swagger_container_labels_traefik_path_prefix != '/' %} && PathPrefix(`{{ slovo_swagger_container_labels_traefik_path_prefix }}`){% endif %}"
slovo_swagger_container_labels_traefik_entrypoints: web-secure
slovo_swagger_container_labels_traefik_tls: "{{ slovo_swagger_container_labels_traefik_entrypoints != 'web' }}"
slovo_swagger_container_labels_traefik_tls_certResolver: default  # noqa var-naming

# A list of extra arguments to pass to the container.
# The container runs read-only; nginx needs writable tmpfs mounts at /tmp and
# /var/cache/nginx, which are declared directly in the systemd service template.
# VPS optimization: cap memory at 64MB.
slovo_swagger_container_extra_arguments:
  - "--memory=64m"

# List of systemd services that slovo-swagger.service depends on
slovo_swagger_systemd_required_services_list: "{{ slovo_swagger_systemd_required_services_list_default + slovo_swagger_systemd_required_services_list_auto + slovo_swagger_systemd_required_services_list_custom }}"
slovo_swagger_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
slovo_swagger_systemd_required_services_list_auto: []
slovo_swagger_systemd_required_services_list_custom: []

# Controls whether uninstall also removes all data (defaults to true — the service is fully self-built/static).
slovo_swagger_uninstall_remove_data: true

# slovo_swagger_restart_necessary controls whether the service
# will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
slovo_swagger_restart_necessary: false
