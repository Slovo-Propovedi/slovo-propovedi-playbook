---

- name: Ensure slovo-docs paths exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: '0750'
    owner: "{{ slovo_user_name }}"
    group: "{{ slovo_group_name }}"
  with_items:
    - path: "{{ slovo_docs_base_path }}"
      when: true
    - path: "{{ slovo_docs_container_src_path }}"
      when: "{{ slovo_docs_container_image_self_build }}"
  when: item.when | bool

- name: Ensure slovo-docs labels file installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/labels.j2"
    dest: "{{ slovo_docs_base_path }}/labels"
    mode: '0640'
    owner: "{{ slovo_user_name }}"
    group: "{{ slovo_group_name }}"
  register: slovo_docs_labels_file_changed

- when: slovo_docs_container_image_self_build | bool
  block:
    # A checkout owned by a different user (a uid change, an earlier clone by another user, etc.) would make the git task below fail on ownership or permissions.
    - name: Ensure slovo-docs repository ownership is correct on self-build
      ansible.builtin.file:
        path: "{{ slovo_docs_container_src_path }}"
        state: directory
        owner: "{{ slovo_user_name }}"
        group: "{{ slovo_group_name }}"
        recurse: true

    - name: Check if slovo-docs repository is a valid git checkout
      ansible.builtin.stat:
        path: "{{ slovo_docs_container_src_path }}/.git"
      register: slovo_docs_git_check

    - name: Remove broken slovo-docs repository if not a valid git checkout
      ansible.builtin.file:
        path: "{{ slovo_docs_container_src_path }}"
        state: absent
      when: not slovo_docs_git_check.stat.exists

    - name: Ensure git trusts the slovo-docs repository directory
      ansible.builtin.command:
        cmd: "git config --global --add safe.directory {{ slovo_docs_container_src_path }}"
      changed_when: false

    - name: Ensure slovo-docs repository is present on self-build
      ansible.builtin.git:
        repo: "{{ slovo_docs_container_image_self_build_repo }}"
        version: "{{ slovo_docs_container_image_self_build_repo_version }}"
        dest: "{{ slovo_docs_container_src_path }}"
        force: "yes"
      register: slovo_docs_git_pull_changed

    # The git clone above runs as the ansible user (root), so the cloned files
    # end up owned by root. Restore ownership to the slovo user afterwards.
    - name: Ensure slovo-docs repository ownership is correct after git clone on self-build
      ansible.builtin.file:
        path: "{{ slovo_docs_container_src_path }}"
        state: directory
        owner: "{{ slovo_user_name }}"
        group: "{{ slovo_group_name }}"
        recurse: true

    # The docs repository's Dockerfile is at the repository ROOT (not in a subdirectory).
    - name: Ensure slovo-docs container image is built
      ansible.builtin.command:
        cmd: |-
          {{ devture_systemd_docker_base_host_command_docker }} buildx build
          --builder={{ slovo_buildx_builder_name }}
          --load
          --tag={{ slovo_docs_container_image }}
          --file={{ slovo_docs_container_src_path }}/Dockerfile
          {{ slovo_docs_container_src_path }}
      when: slovo_docs_git_pull_changed.changed
      register: slovo_docs_docker_image_build_changed

- name: Ensure slovo-docs container network is created
  when: slovo_docs_container_network != 'host'
  community.general.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ slovo_docs_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"

- name: Ensure slovo-docs.service installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/slovo-docs.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/slovo-docs.service"
    mode: '0644'
  register: slovo_docs_systemd_unit_changed

- name: Determine whether slovo-docs needs a restart
  ansible.builtin.set_fact:
    slovo_docs_restart_necessary: >-
      {{
        slovo_docs_labels_file_changed.changed | default(false)
        or slovo_docs_git_pull_changed.changed | default(false)
        or slovo_docs_docker_image_build_changed.changed | default(false)
        or slovo_docs_systemd_unit_changed.changed | default(false)
      }}
