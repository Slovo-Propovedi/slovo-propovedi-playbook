---

# slovo-docs is a standalone static docs site (Swagger UI) + OpenAPI spec service for slovo-propovedi.
# Project source code URL: https://git.lightnode.ru/Slovo_Propovedi/slovo-propovedi-docs
# The container image is built locally from the repository (see `Dockerfile` at the repo ROOT).
# Unlike the frontend, the nginx.conf is baked into the image — no config volume is mounted.

slovo_docs_enabled: true

# The identifier used for the container name and the systemd service name.
slovo_docs_identifier: "slovo-docs"

# The hostname at which slovo-docs is served.
slovo_docs_hostname: ''

# The path at which slovo-docs is served.
# This value must either be `/` or not end with a slash (e.g. `/docs`).
slovo_docs_path_prefix: /

slovo_docs_base_path: "{{ slovo_base_data_path }}/docs"

# Self-build (the container image is built locally from the git repository).
slovo_docs_container_image_self_build: true
slovo_docs_container_image_self_build_repo: "https://git.lightnode.ru/Slovo_Propovedi/slovo-propovedi-docs.git"
# The docs repository uses `main` as its default branch (not `master` like the other repos).
slovo_docs_container_image_self_build_repo_version: "main"
slovo_docs_container_src_path: "{{ slovo_docs_base_path }}/container-src"

# Build resource limits are enforced by the shared constrained buildx builder
# (see roles/custom/slovo-buildx). There are no per-build memory/cpu flags.

# The locally-built container image name.
slovo_docs_container_image_name: "slovo-docs"
slovo_docs_container_image_tag: "latest"
slovo_docs_container_image: "{{ slovo_docs_container_image_name }}:{{ slovo_docs_container_image_tag }}"

# The port nginx listens on inside the container (non-root, no special capabilities needed).
slovo_docs_container_port: 8080

# The base container network. It will be auto-created by this role if it doesn't exist already.
slovo_docs_container_network: ''

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
slovo_docs_container_additional_networks: "{{ slovo_docs_container_additional_networks_default + slovo_docs_container_additional_networks_auto + slovo_docs_container_additional_networks_custom }}"
slovo_docs_container_additional_networks_default: []
slovo_docs_container_additional_networks_auto: []
slovo_docs_container_additional_networks_custom: []

# slovo_docs_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
slovo_docs_container_labels_traefik_enabled: true
slovo_docs_container_labels_traefik_docker_network: "{{ slovo_docs_container_network }}"
slovo_docs_container_labels_traefik_hostname: "{{ slovo_docs_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/docs`).
slovo_docs_container_labels_traefik_path_prefix: "{{ slovo_docs_path_prefix }}"
slovo_docs_container_labels_traefik_rule: "Host(`{{ slovo_docs_container_labels_traefik_hostname }}`){% if slovo_docs_container_labels_traefik_path_prefix != '/' %} && PathPrefix(`{{ slovo_docs_container_labels_traefik_path_prefix }}`){% endif %}"
slovo_docs_container_labels_traefik_entrypoints: web-secure
slovo_docs_container_labels_traefik_tls: "{{ slovo_docs_container_labels_traefik_entrypoints != 'web' }}"
slovo_docs_container_labels_traefik_tls_certResolver: default  # noqa var-naming

# A list of extra arguments to pass to the container.
# The container runs read-only (--read-only); nginx needs writable tmpfs mounts at
# /tmp and /var/cache/nginx, which are declared directly in the systemd service
# template (see templates/systemd/slovo-docs.service.j2).
# Both tmpfs mounts are owned by the slovo system user (uid={{ slovo_user_uid }},
# gid={{ slovo_user_gid }}) because the container runs as that non-root user and
# nginx must create its temp/cache dirs (client_temp, proxy_temp, ...) under
# /var/cache/nginx at startup. Without uid/gid/mode, Docker mounts tmpfs root-owned
# and nginx aborts with "mkdir() ... Permission denied" → crash-loop.
# Because the container is --read-only, nginx also needs a writable /run tmpfs to
# write its PID file (/run/nginx.pid); without it nginx aborts with
# 'open() "/run/nginx.pid" failed (30: Read-only file system)' → crash-loop.
# VPS optimization: cap memory at 64MB.
slovo_docs_container_extra_arguments:
  - "--memory=64m"

# List of systemd services that slovo-docs.service depends on
slovo_docs_systemd_required_services_list: "{{ slovo_docs_systemd_required_services_list_default + slovo_docs_systemd_required_services_list_auto + slovo_docs_systemd_required_services_list_custom }}"
slovo_docs_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
slovo_docs_systemd_required_services_list_auto: []
slovo_docs_systemd_required_services_list_custom: []

# Controls whether uninstall also removes all data (defaults to true — the service is fully self-built/static).
slovo_docs_uninstall_remove_data: true

# slovo_docs_restart_necessary controls whether the service
# will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
slovo_docs_restart_necessary: false
