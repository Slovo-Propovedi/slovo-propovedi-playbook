---
# slovo-propovedi-playbook group_vars
# This file wires together all roles (postgres, traefik, pgbouncer, minio, adminer)

# =============================================================================
# Docker configuration
# =============================================================================

docker_install_compose: false
docker_install_compose_plugin: false

# Controls whether the playbook installs Docker on the server.
# Referenced by `setup.yml` (`when: docker_installation_enabled | bool`) to gate the `galaxy/docker` role.
docker_installation_enabled: true

# Docker daemon options (written to /etc/docker/daemon.json).
# Rotate container logs to keep the 40GB disk from filling up.
docker_daemon_options:
  log-driver: json-file
  log-opts:
    max-size: 10m
    max-file: "3"

# =============================================================================
# Swap (VPS optimization: 2GB swap for a 1 CPU / 2GB RAM box)
# =============================================================================
# The slovo-swap role (registered early in setup.yml) creates a swap file and
# tunes vm.swappiness. It gives the box headroom against OOM-killer kills when
# memory spikes (backend self-builds, MinIO uploads, etc.).

slovo_swap_enabled: true
slovo_swap_size_mb: 2048
slovo_swap_swappiness: 10

# =============================================================================
# Reverse proxy configuration
# =============================================================================

slovo_playbook_reverse_proxy_type: playbook-managed-traefik
# `slovo_playbook_reverse_proxy_container_network` is computed by `slovo-base`
# (defaults/main.yml) as `'traefik'` when the playbook-managed Traefik is used, else ''.
slovo_playbook_traefik_labels_enabled: "{{ traefik_enabled | bool }}"

# CRITICAL: the Traefik label `traefik.docker.network` for every Traefik-exposed service must point to the
# shared reverse-proxy network (the one each service joins via its `*_container_additional_networks_auto`),
# NOT the service's own primary network. Traefik can only reach a container through a network it shares with it.
slovo_minio_container_labels_traefik_docker_network: "{{ slovo_playbook_reverse_proxy_container_network }}"
slovo_adminer_container_labels_traefik_docker_network: "{{ slovo_playbook_reverse_proxy_container_network }}"

# Each custom role gates its Traefik labels on `slovo_*_container_labels_traefik_enabled` (role default: true).
# Wire them to the hub switch so that when Traefik is disabled, no service emits Traefik labels.
slovo_minio_container_labels_traefik_enabled: "{{ slovo_playbook_traefik_labels_enabled }}"
slovo_adminer_container_labels_traefik_enabled: "{{ slovo_playbook_traefik_labels_enabled }}"

# =============================================================================
# Postgres
# =============================================================================

postgres_enabled: true
postgres_identifier: slovo-postgres
postgres_architecture: "{{ slovo_architecture }}"
postgres_base_path: "{{ slovo_base_data_path }}/postgres"
postgres_uid: "{{ slovo_user_uid }}"
postgres_gid: "{{ slovo_user_gid }}"

# 2026-08-18: override the galaxy role's default C locale (lc-collate/lc-ctype=C)
# which caused case-sensitive FTS search on Russian text.  The live DB was recreated
# with ru_RU.UTF-8 on the VPS; these overrides keep the env file in sync so a
# playbook rerun does not revert the fix.
postgres_default_lc_collate: ru_RU.UTF-8
postgres_default_lc_type: ru_RU.UTF-8

# The postgres role creates a network with this name
postgres_container_network: slovo-postgres

# These credentials are shared by postgres + pgbouncer roles. Do not remove.
postgres_connection_username: "{{ slovo_backend_postgres_user }}"
postgres_connection_password: "{{ slovo_backend_postgres_password }}"
postgres_db_name: "{{ slovo_backend_postgres_db }}"

# Databases to create on startup
postgres_managed_databases_auto: |
  {{
    ([{'name': slovo_backend_postgres_db, 'username': slovo_backend_postgres_user, 'password': slovo_backend_postgres_password}])
  }}

# VPS optimization: 1 vCPU / 2GB RAM — pgtune overrides for a small server.
#
# NOTE: the postgres role's pgtune variables are expressed in KILOBYTES (see
# `postgres_postgres_process_extra_arguments_default` in the role), so the
# values below are the kB equivalents of the target sizes (128MB = 131072kB, etc.).
postgres_shared_buffers: 131072 # 128MB
postgres_max_connections: 20
postgres_work_mem: 2048 # 2MB per sort/hash operation (20 connections * 2MB = 40MB worst case)
postgres_effective_cache_size: 524288 # 512MB
postgres_maintenance_work_mem: 32768 # 32MB
postgres_max_wal_size: 1048576 # 1GB
postgres_min_wal_size: 262144 # 256MB
# The role's default formula would set `wal_buffers` to the whole of `shared_buffers`
# for small shared_buffers values — cap it at a sane 4MB instead.
postgres_wal_buffers: 4096 # 4MB

# Runtime memory limit for the postgres container (shared_buffers 128MB + per-connection work_mem fits).
postgres_container_extra_arguments: ["--memory=384m"]

# A larger /dev/shm helps VACUUM, but 128MB is enough for a small server and keeps RAM tight.
postgres_container_shm_size: 128m

# =============================================================================
# Postgres backup (daily pg_dump via MASH postgres_backup galaxy role)
# =============================================================================

postgres_backup_enabled: true

postgres_backup_identifier: slovo-postgres-backup
postgres_backup_architecture: "{{ slovo_architecture }}"
postgres_backup_base_path: "{{ slovo_base_data_path }}/postgres-backup"
postgres_backup_uid: "{{ slovo_user_uid }}"
postgres_backup_gid: "{{ slovo_user_gid }}"

# Connection — directly to postgres on its docker network (NOT via pgbouncer).
postgres_backup_connection_hostname: "{{ postgres_identifier }}"
postgres_backup_connection_port: "{{ postgres_connection_port }}"
postgres_backup_connection_username: "{{ postgres_connection_username }}"
postgres_backup_connection_password: "{{ postgres_connection_password }}"

# Database list — backs up the single backend database.
postgres_backup_databases_auto: "{{ postgres_managed_databases | map(attribute='name') if postgres_enabled else [] }}"

# Postgres data path — lets the role auto-detect the container image version.
postgres_backup_postgres_data_path: "{{ postgres_data_path if postgres_enabled else '' }}"
postgres_backup_postgres_role_include_name: galaxy/postgres

# Schedule and retention.
postgres_backup_schedule: "30 04 * * *"
postgres_backup_keep_days: 7
postgres_backup_keep_weeks: 4
postgres_backup_keep_months: 6

# Full DB dump (-Z9 = gzip level 9). No --schema=public restriction — we want the full DB.
postgres_backup_extra_opts: "-Z9"

# systemd dependencies — start after slovo-postgres.service.
postgres_backup_systemd_required_services_list_auto: |
  {{
    ([(postgres_identifier + '.service')] if (postgres_enabled and postgres_backup_connection_hostname == postgres_connection_hostname) else [])
  }}

# Container network — share postgres's network so the backup container can reach
# slovo-postgres:5432 directly.
postgres_backup_container_network: "{{ (postgres_container_network if (postgres_enabled and postgres_backup_connection_hostname == postgres_connection_hostname) else postgres_backup_identifier) }}"
postgres_backup_container_additional_networks_auto: |-
  {{
    ([postgres_container_network] if (postgres_enabled and postgres_backup_connection_hostname == postgres_connection_hostname and postgres_backup_container_network != postgres_container_network) else [])
  }}

# =============================================================================
# Traefik
# =============================================================================

traefik_enabled: "{{ slovo_playbook_reverse_proxy_type == 'playbook-managed-traefik' }}"
traefik_identifier: slovo-traefik
traefik_base_path: "{{ slovo_base_data_path }}/traefik"
traefik_uid: "{{ slovo_user_uid }}"
traefik_gid: "{{ slovo_user_gid }}"

# Increase read timeout for large file uploads (sermon audio/video)
traefik_config_entrypoint_web_transport_respondingTimeouts_readTimeout: 300s
traefik_config_entrypoint_web_secure_transport_respondingTimeouts_readTimeout: 300s

# VPS optimization: 1 vCPU — gzip-only compression. zstd/brotli are CPU-heavy
# and would steal cycles from the services on a single-core box.
traefik_config_http_middlewares_compression_middleware_config_encodings_zstd_enabled: false
traefik_config_http_middlewares_compression_middleware_config_encodings_br_enabled: false
# gzip stays enabled (role default).

# Per-source-IP rate limiting for Traefik-exposed API routers.
# The middleware is defined here; services attach it via their Traefik labels.
traefik_config_http_middlewares_custom:
  slovo-rate-limit:
    rateLimit:
      average: 20
      burst: 40

# Runtime memory limit for the traefik container (galaxy role — override here).
traefik_container_extra_arguments: ["--memory=128m"]

traefik_systemd_required_services_list: "{{ [devture_systemd_docker_base_docker_service_name] }}"

# =============================================================================
# MinIO
# =============================================================================

slovo_minio_enabled: true
slovo_minio_identifier: slovo-minio
slovo_minio_base_path: "{{ slovo_base_data_path }}/minio"

# Primary network
slovo_minio_container_network: slovo-minio

# Cross-network joins: minio must reach traefik (for API + console routing)
slovo_minio_container_additional_networks_auto: |
  {{
    ([slovo_playbook_reverse_proxy_container_network] if slovo_playbook_traefik_labels_enabled and slovo_playbook_reverse_proxy_container_network else [])
  }}

# =============================================================================
# Adminer
# =============================================================================

slovo_adminer_enabled: true
slovo_adminer_identifier: slovo-adminer
slovo_adminer_base_path: "{{ slovo_base_data_path }}/adminer"

# Primary network
slovo_adminer_container_network: slovo-adminer

# Cross-network joins: adminer must reach traefik (web UI) + postgres (DB)
slovo_adminer_container_additional_networks_auto: |
  {{
    ([slovo_playbook_reverse_proxy_container_network] if slovo_playbook_traefik_labels_enabled and slovo_playbook_reverse_proxy_container_network else [])
    + ([postgres_container_network] if postgres_enabled else [])
  }}

# Adminer depends on postgres being up
slovo_adminer_systemd_required_services_list_auto: |
  {{
    ([postgres_identifier + '.service'] if postgres_enabled else [])
  }}

# =============================================================================
# PgBouncer (connection pooler in front of postgres)
# =============================================================================
# PgBouncer is an INTERNAL service: it has no Traefik labels, no hostname, and
# is never exposed to the internet. It pools database connections so
# postgres only ever sees a handful of them (max_connections is capped at 20).

slovo_pgbouncer_enabled: true
slovo_pgbouncer_identifier: slovo-pgbouncer

# The port PgBouncer listens on inside its container.
# NOTE: this is deliberately 5432, NOT 6432 — the backend service (deployed
# separately via Forgejo Actions) hardcodes POSTGRES_PORT=5432 and cannot be told
# to use another port, so the pooler must listen on 5432 for it to reach the DB.
slovo_pgbouncer_container_port: 5432

# Primary network (own — for self-containment, following the per-service pattern)
slovo_pgbouncer_container_network: slovo-pgbouncer

# Cross-network joins: pgbouncer must reach postgres
slovo_pgbouncer_container_additional_networks_auto: |
  {{
    ([postgres_container_network] if postgres_enabled else [])
  }}

# PgBouncer depends on docker (default) + postgres (DB)
slovo_pgbouncer_systemd_required_services_list_auto: |
  {{
    ([postgres_identifier + '.service'] if postgres_enabled else [])
  }}

# PostgreSQL server connection (wired from the postgres role vars — no credential drift).
slovo_pgbouncer_postgres_host: "{{ postgres_identifier }}"
slovo_pgbouncer_postgres_port: "{{ postgres_connection_port }}"
slovo_pgbouncer_postgres_username: "{{ slovo_backend_postgres_user }}"
slovo_pgbouncer_postgres_password: "{{ slovo_backend_postgres_password }}"
slovo_pgbouncer_postgres_dbname: "{{ slovo_backend_postgres_db }}"

# =============================================================================
# Admin user seeding
# =============================================================================

slovo_admin_user_enabled: true

# =============================================================================
# Service registry for systemd_service_manager
# =============================================================================
# Lower priority = starts first, stops last
# Order: traefik (250) → postgres (500) → postgres-backup (520) → pgbouncer (550) → minio (600) → adminer (2100)

# VPS optimization: restart services in priority batches (non-blocking within each
# priority level), so a restart storm doesn't overwhelm a single-core box.
devture_systemd_service_manager_service_restart_mode: priority-batched

# Single-core VPS + priority-batched restarts of the whole stack: the 15s default
# up-verification delay was too tight and caused false "not running" failures
# (slovo-postgres-backup.service, slovo-adminer.service) while containers were still
# converging. Confirmed in production 2026-09-11.
devture_systemd_service_manager_up_verification_delay_seconds: 45

# Only restart services whose configuration actually changed when running install-* tags.
# When running setup-* tags (or no tags), restart everything unconditionally.
devture_systemd_service_manager_conditional_restart_enabled: "{{ ansible_run_tags | select('match', 'setup-') | list | length == 0 }}"

devture_systemd_service_manager_services_list_auto: |
  {{
    ([{'name': 'slovo-traefik.service', 'priority': 250, 'restart_necessary': traefik_restart_necessary | bool, 'groups': ['slovo', 'traefik']}] if traefik_enabled else [])
    + ([{'name': 'slovo-postgres.service', 'priority': 500, 'restart_necessary': postgres_restart_necessary | bool, 'groups': ['slovo', 'postgres']}] if postgres_enabled else [])
    + ([{'name': (postgres_backup_identifier ~ '.service'), 'priority': 520, 'restart_necessary': postgres_backup_restart_necessary | bool, 'groups': ['slovo', 'postgres-backup']}] if postgres_backup_enabled and postgres_enabled else [])
    + ([{'name': 'slovo-pgbouncer.service', 'priority': 550, 'restart_necessary': slovo_pgbouncer_restart_necessary | bool, 'groups': ['slovo', 'pgbouncer']}] if slovo_pgbouncer_enabled else [])
    + ([{'name': 'slovo-minio.service', 'priority': 600, 'restart_necessary': slovo_minio_restart_necessary | bool, 'groups': ['slovo', 'minio']}] if slovo_minio_enabled else [])
    + ([{'name': 'slovo-adminer.service', 'priority': 2100, 'restart_necessary': slovo_adminer_restart_necessary | bool, 'groups': ['slovo', 'adminer']}] if slovo_adminer_enabled else [])
   }}

# =============================================================================
# Playbook state preserver
# =============================================================================
# Preserves vars.yml and the playbook commit hash on the server so they can be
# restored if lost.  The uid/gid are set as facts by the slovo-base role which
# runs earlier in setup.yml.

devture_playbook_state_preserver_uid: "{{ slovo_user_uid }}"
devture_playbook_state_preserver_gid: "{{ slovo_user_gid }}"

devture_playbook_state_preserver_vars_preservation_dst: "{{ slovo_base_data_path }}/vars.yml"
devture_playbook_state_preserver_commit_hash_preservation_dst: "{{ slovo_base_data_path }}/git_hash.yml"
