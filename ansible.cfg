# Ansible configuration for the slovo-propovedi playbook.
# Commands are expected to be run from the repository root (see justfile/README).

[defaults]
# Use the inventory in the inventory/ directory
inventory = inventory/hosts

# Resolve roles referenced as `custom/*` and `galaxy/*` in setup.yml.
# Both live under roles/ (roles/custom and roles/galaxy), so the parent
# directory is the roles path, not the individual subdirectories.
roles_path = roles

# Don't gather facts by default (playbook handles this per-play)
#gathering = explicit

# Skip host key verification on first connection to a fresh server
host_key_checking = False

# Timeout for SSH connections
timeout = 30

# Use pipelining for speed (see also the ssh_connection section below)
pipelining = True

# The `yaml` stdout callback requires the community.general collection,
# which is not currently in requirements.yml — use the built-in `default`
# callback instead. To switch, install community.general and set
# stdout_callback = yaml.
stdout_callback = default

# Retry files are annoying
retry_files_enabled = False

# Vault password file (if needed) — the playbook supports vault-encrypted
# vars (see docs/configuring-playbook.md); use --ask-vault-pass if no file.
#vault_password_file = .vault_pass

# Python interpreter discovery (targets run Python 3)
interpreter_python = auto_silent

[ssh_connection]
# Control path for SSH multiplexing
control_path = /tmp/ansible-%%h-%%p-%%r

[privilege_escalation]
# setup.yml runs every play with `become: true`
become = True
become_method = sudo
